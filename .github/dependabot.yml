version: 2
multi-ecosystem-groups:
  provenance-toolchain:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: provenance-toolchain
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: provenance-toolchain
    open-pull-requests-limit: 2
