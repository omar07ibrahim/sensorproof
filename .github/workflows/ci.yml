name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sensorproof-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Python 3.14.6
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Install exact quality tools
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.6"
          python -m pip install --no-deps --require-hashes -r requirements/quality.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Lint, type-check, and test
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest -q --cov=sensorproof --cov-report=term-missing --cov-fail-under=90
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  compatibility:
    name: Compatibility / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.15", "3.12.13", "3.13.14", "3.14.6"]
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - name: Run compatibility suite
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python ${{ matrix.python }}"
          python -m pip install --no-deps --require-hashes -r requirements/quality.txt
          python -m pip install --no-build-isolation --no-deps .
          python -m pytest -q
          git diff --check

  wheel:
    name: Wheel / clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up exact Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.6"
      - name: Build and inspect wheel
        run: |
          set -euo pipefail
          python -m pip install --no-deps --require-hashes -r requirements/quality.txt
          python -m build --wheel --no-isolation --outdir dist
          archive="$(find dist -maxdepth 1 -name 'sensorproof-*.whl' -print -quit)"
          test -n "$archive"
          ARCHIVE="$archive" python - <<'PY'
          import os
          import zipfile

          with zipfile.ZipFile(os.environ["ARCHIVE"]) as wheel:
              names = set(wheel.namelist())
          required = {
              "sensorproof/__init__.py",
              "sensorproof/cli.py",
              "sensorproof/engine.py",
              "sensorproof/report.py",
              "sensorproof/verify.py",
              "sensorproof/py.typed",
          }
          assert required <= names
          assert not any(name.startswith(("docs/", "tests/", "tools/")) for name in names)
          PY
      - name: Exercise installed package outside checkout
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/sensorproof-consumer"
          python -m venv "$consumer/venv"
          "$consumer/venv/bin/pip" install --no-index --find-links dist sensorproof==0.1.0
          cp scenarios/urban-canyon.json "$consumer/scenario.json"
          (
            cd "$consumer"
            ./venv/bin/sensorproof run scenario.json --output run.json
            ./venv/bin/sensorproof verify run.json
            ./venv/bin/sensorproof report run.json --output report.html
            test -s report.html
            ./venv/bin/python -c "import sensorproof; assert sensorproof.__version__ == '0.1.0'"
          )
          git diff --check
