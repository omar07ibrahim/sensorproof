[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "sensorproof"
dynamic = ["version"]
description = "Deterministic fault-aware sensor fusion with independently replayable decision certificates"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
  { name = "Omar Ibrahim", email = "31526072+omar07ibrahim@users.noreply.github.com" },
]
keywords = ["robotics", "sensor-fusion", "fault-detection", "state-estimation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Documentation = "https://github.com/omar07ibrahim/sensorproof#readme"
Issues = "https://github.com/omar07ibrahim/sensorproof/issues"
Repository = "https://github.com/omar07ibrahim/sensorproof"

[project.scripts]
sensorproof = "sensorproof.cli:main"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sensorproof"]

[tool.hatch.version]
path = "src/sensorproof/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/sensorproof/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
